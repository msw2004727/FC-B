# FC-B CI：型別檢查＋vitest 全套＋i18n 檢查（T-051），另加首頁 gzip 預算與規則測試（emulator）。
# 只有 bundle-budget 這個 job 會建置。建置輸出只拿來量大小：不部署、不上傳 artifact、不用 secret。
# 建置不連 Firestore，只是把 PROD 設定寫進檔案。除了規則測試（emulator），其餘 job 不建置、不連網路服務。不用第三方 action。
# 規則測試（emulator）會連 raw.githubusercontent.com 讀公開正本、不用 secret。
# 本機（Windows）不再跑全測，Playwright 與速度量測仍在本機。
name: CI

# 2026-11-12 CI 省時（ci-cost-trim）：取代原本「任何分支 push 都跑全套」。
# - push 只在 main 觸發完整 CI（上線證據 9 項＝本檔 8 個 job＋Cloudflare Pages，多「規則測試（emulator）」）。
#   其他分支 push 改走 ci-lite.yml 輕量檢查；backup/**、promo 分支完全不跑。
# - PR 照跑完整 CI；要在分支上跑全套，用 Actions 頁 workflow_dispatch 選分支。
# - 只改 Markdown／docs／.claude 的 push 或 PR 不觸發；同一次 push 只要有任一檔不在清單內就照跑全套。
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.claude/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.claude/**'
  workflow_dispatch:

# 最小權限：只讀 repo 內容。
permissions:
  contents: read

# 同一分支（或同一 PR）同一種事件的舊 run 自動取消；群組加 event_name，避免 PR run 與手動 run 互相取消。
# main 的群組含 github.sha、每個 SHA 自成一組且不取消：cancel-in-progress: false 只保護執行中的 run，
# 同群組「排隊中」的 run 仍會被更新的 run 擠掉，連推多次 main 時中間 SHA 會沒有 CI 紀錄（顧問 §3.119）。
# PR 的 ref 是 refs/pull/N/merge（每個 PR 一組）；取代原本 head_ref || ref_name（不同 PR 同分支名會撞組）。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 站內時間字串（YYYY/MM/DD HH:mm）一律當台北時間解析；本機開發機時區即為 Asia/Taipei，
    # GitHub runner 預設 UTC。這是還原開發環境，不是放寬或 skip 測試。
    # 公告上下架判斷已由 054b 改為台北牆鐘；P01 活動時間解析已由 054c 收斂，另以 UTC 全套守門。
    env:
      TZ: Asia/Taipei
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Node 版本與本機一致（本機 v24.20.0）；cache: npm 以 package-lock.json 為快取鍵。
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      # --no-audit／--no-fund：不為 npm audit、funding 提示額外對外連線。
      - id: install
        name: 安裝依賴（npm ci）
        run: npm ci --no-audit --no-fund

      # 以下三個檢查彼此獨立：任一失敗整個 job 為紅，但每個步驟都會跑完，一次看到所有失敗。
      # 只有依賴安裝失敗（沒有 node_modules）或被手動取消時才不跑。
      - name: 型別檢查（tsc）
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx tsc --noEmit

      - name: 單元測試（vitest 全套）
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx vitest run

      - name: i18n 檢查（7 語系）
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/check-i18n.mjs

      - name: 規則副本檢查
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/check-rules-sync.mjs

  # T-054c／Q-7：正式 UTC 全套守門；只跑 vitest，不另跑型別或 i18n 檢查。
  utc-full:
    name: 全套（TZ=UTC）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - id: install
        name: 安裝依賴（npm ci）
        run: npm ci --no-audit --no-fund

      - name: 單元測試（vitest 全套）
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx vitest run

  # 時區矩陣（T-054a，檔案清單 T-054b／T-054c）：只跑時區敏感測試，四個時區各跑一次，期望值完全相同。
  # 與上面的 check job 互補：check 維持 TZ=Asia/Taipei 跑全套（還原開發環境）。
  # P01 活動時間解析已由 054c 收斂，utc-full 跑 UTC 全套；Tokyo／LA 維持檔案清單矩陣。
  # UTC 全套耗時超過 check 的 1.5 倍或不穩時回報顧問，不自行關閉或放寬。
  # 刻意不做的事同 check：不建置、不部署、不用 secret、不用第三方 action。
  tz-matrix:
    name: 時區矩陣（TZ=${{ matrix.tz }}）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # 四個時區各自獨立，一個紅不取消其他，一次看到所有失敗。
      fail-fast: false
      matrix:
        tz: [Asia/Taipei, Asia/Tokyo, UTC, America/Los_Angeles]
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: 安裝依賴（npm ci）
        run: npm ci --no-audit --no-fund

      - name: 時區敏感測試（vitest）
        run: npx vitest run src/core/taipei-time.test.ts src/features/home/data/announcements.test.ts src/features/events/data/event-create.test.ts src/features/events/data/event-form-model.test.ts src/features/events/data/signup-restrictions.test.ts src/features/events/data/my-activities-model.test.ts src/features/events/components/legacy/EventDetailMainView.test.tsx src/data/inbox-delivery.test.ts src/features/checkin/data/__tests__/attendance.test.ts src/features/events/data/attendance-edit.test.ts src/data/op-log.test.ts src/features/events/data/line-notify-bind.test.ts src/features/admin-banners/data/banner-model.test.ts src/features/admin-banners/data/banner-admin.test.ts src/core/event-time.test.ts src/features/checkin/CheckinPage.shell.test.tsx src/features/checkin/data/__tests__/scan-events.test.ts src/features/clubs/components/legacy/TeamDetailWeekStrip.test.tsx src/features/clubs/data/team-detail-model.test.ts src/features/clubs/pages/TeamDetailPage.test.tsx src/features/events/components/legacy/ActivityCalendar.test.tsx src/features/events/data/attendance-settle.test.ts src/features/events/data/calendar-model.test.ts src/features/events/data/event-calendar.test.ts src/features/events/data/event-comments.test.ts src/features/events/data/event-lifecycle.test.ts src/features/events/data/signup.test.ts src/features/events/data/terminal.test.ts src/features/events/pages/ActivitiesPage.test.tsx src/features/events/pages/EventDetailPage.3b2b.test.tsx src/features/home/data/next-activity.test.ts src/features/profile/data/activity-records.test.ts src/core/taipei-guard.test.ts

  # 首頁主程式 gzip 預算。只有這個 job 建置。
  # 輸出只量大小：不部署、不上傳 artifact、不用 secret、不連網路服務
  # （vite build 不連 Firestore，只是把 PROD 設定寫進檔案）。
  bundle-budget:
    name: 首頁 gzip 預算
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: 安裝依賴（npm ci）
        run: npm ci --no-audit --no-fund

      - name: 建置（只為量首頁 JS gzip）
        run: npx vite build

      # 同一支腳本：第一條只算入口 index-*.js（60KB）；第二條印出入口＋modulepreload 合計，
      # 超過寬鬆上限才失敗。正式門檻等這段日誌再由 PM 收緊，不要另寫第二支腳本。
      - name: 檢查首頁 gzip 預算（入口 60KB；入口＋modulepreload 寬鬆上限）
        run: node scripts/check-bundle-budget.mjs dist

  # 規則副本對公開正本，並在 Firestore emulator 跑 *.rules.test.*。
  # 會連 raw.githubusercontent.com 讀公開正本、不用 secret。不另加 permissions。
  rules:
    name: 規則測試（emulator）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: 安裝依賴（npm ci）
        run: npm ci --no-audit --no-fund

      # 只警示不擋：FC 正本改規則後 FC-B 未同步前，不擋不相干的前端上線（Opus 審 P2）；副本自身雜湊與規則測試照擋。
      - name: 規則副本對正本
        continue-on-error: true
        run:node scripts/check-rules-sync.mjs --upstream-url https://raw.githubusercontent.com/msw2004727/FC/main

      - name: 規則測試
        run: npm run test:rules
