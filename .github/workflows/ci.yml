# FC-B CI：型別檢查＋vitest 全套＋i18n 檢查（T-051）。
# 刻意不做的事：不執行任何建置（FC-B 的 build 預設連 PROD）、不部署、不用 secret、不用第三方 action。
# 本機（Windows）不再跑全測，Playwright 與速度量測仍在本機。
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# 最小權限：只讀 repo 內容。
permissions:
  contents: read

# 同一分支的舊 run 自動取消。PR 事件用 head_ref、push 事件用 ref_name，
# 兩者同為分支名，所以「分支 push＋該分支的 PR」只會留最新的一個 run。
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 站內時間字串（YYYY/MM/DD HH:mm）一律當台北時間解析；本機開發機時區即為 Asia/Taipei，
    # GitHub runner 預設 UTC。這是還原開發環境，不是放寬或 skip 測試。
    # 已知需要它的測試：src/features/home/data/announcements.test.ts「公告有效狀態」2 案
    # （首次實跑 run 40346895901 在 UTC 下失敗）。
    env:
      TZ: Asia/Taipei
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Node 版本與本機一致（本機 v24.20.0）；cache: npm 以 package-lock.json 為快取鍵。
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      # --no-audit／--no-fund：不為 npm audit、funding 提示額外對外連線。
      - id: install
        name: 安裝依賴（npm ci）
        run: npm ci --no-audit --no-fund

      # 以下三個檢查彼此獨立：任一失敗整個 job 為紅，但每個步驟都會跑完，一次看到所有失敗。
      # 只有依賴安裝失敗（沒有 node_modules）或被手動取消時才不跑。
      - name: 型別檢查（tsc）
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx tsc --noEmit

      - name: 單元測試（vitest 全套）
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx vitest run

      - name: i18n 檢查（7 語系）
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/check-i18n.mjs

  # 時區矩陣（T-054a）：只跑時區敏感測試，行程以四種時區各啟動一次，期望值完全相同。
  # 與上面的 check job 互補：check 維持 TZ=Asia/Taipei 跑全套（還原開發環境）；
  # 這裡不跑全套，因為全套在非台北時區目前仍有依賴本地解析的既有測試（例如 announcements.test.ts，
  # 屬 054b 的修正範圍）。全套 UTC job 將在 054c 啟用；054b／054c 新增的時區敏感測試檔請加進下方指令。
  # 刻意不做的事同 check：不建置、不部署、不用 secret、不用第三方 action。
  tz-matrix:
    name: 時區矩陣（TZ=${{ matrix.tz }}）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # 四個時區各自獨立，一個紅不取消其他，一次看到所有失敗。
      fail-fast: false
      matrix:
        tz: [Asia/Taipei, Asia/Tokyo, UTC, America/Los_Angeles]
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: 安裝依賴（npm ci）
        run: npm ci --no-audit --no-fund

      - name: 時區敏感測試（vitest）
        run: npx vitest run src/core/taipei-time.test.ts
