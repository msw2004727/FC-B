# FC-B CI：型別檢查＋vitest 全套＋i18n 檢查（T-051）。
# 刻意不做的事：不執行任何建置（FC-B 的 build 預設連 PROD）、不部署、不用 secret、不用第三方 action。
# 本機（Windows）不再跑全測，Playwright 與速度量測仍在本機。
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# 最小權限：只讀 repo 內容。
permissions:
  contents: read

# 同一分支的舊 run 自動取消。PR 事件用 head_ref、push 事件用 ref_name，
# 兩者同為分支名，所以「分支 push＋該分支的 PR」只會留最新的一個 run。
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 站內時間字串（YYYY/MM/DD HH:mm）一律當台北時間解析；本機開發機時區即為 Asia/Taipei，
    # GitHub runner 預設 UTC。這是還原開發環境，不是放寬或 skip 測試。
    # 公告上下架判斷已由 054b 改為台北牆鐘；P01 活動時間解析已由 054c 收斂，另以 UTC 全套守門。
    env:
      TZ: Asia/Taipei
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Node 版本與本機一致（本機 v24.20.0）；cache: npm 以 package-lock.json 為快取鍵。
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      # --no-audit／--no-fund：不為 npm audit、funding 提示額外對外連線。
      - id: install
        name: 安裝依賴（npm ci）
        run: npm ci --no-audit --no-fund

      # 以下三個檢查彼此獨立：任一失敗整個 job 為紅，但每個步驟都會跑完，一次看到所有失敗。
      # 只有依賴安裝失敗（沒有 node_modules）或被手動取消時才不跑。
      - name: 型別檢查（tsc）
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx tsc --noEmit

      - name: 單元測試（vitest 全套）
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx vitest run

      - name: i18n 檢查（7 語系）
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/check-i18n.mjs

  # T-054c／Q-7：正式 UTC 全套守門；只跑 vitest，不另跑型別或 i18n 檢查。
  utc-full:
    name: 全套（TZ=UTC）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - id: install
        name: 安裝依賴（npm ci）
        run: npm ci --no-audit --no-fund

      - name: 單元測試（vitest 全套）
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx vitest run

  # 時區矩陣（T-054a，檔案清單 T-054b／T-054c）：只跑時區敏感測試，四個時區各跑一次，期望值完全相同。
  # 與上面的 check job 互補：check 維持 TZ=Asia/Taipei 跑全套（還原開發環境）。
  # P01 活動時間解析已由 054c 收斂，utc-full 跑 UTC 全套；Tokyo／LA 維持檔案清單矩陣。
  # UTC 全套耗時超過 check 的 1.5 倍或不穩時回報顧問，不自行關閉或放寬。
  # 刻意不做的事同 check：不建置、不部署、不用 secret、不用第三方 action。
  tz-matrix:
    name: 時區矩陣（TZ=${{ matrix.tz }}）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # 四個時區各自獨立，一個紅不取消其他，一次看到所有失敗。
      fail-fast: false
      matrix:
        tz: [Asia/Taipei, Asia/Tokyo, UTC, America/Los_Angeles]
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: 安裝依賴（npm ci）
        run: npm ci --no-audit --no-fund

      - name: 時區敏感測試（vitest）
        run: npx vitest run src/core/taipei-time.test.ts src/features/home/data/announcements.test.ts src/features/events/data/event-create.test.ts src/features/events/data/event-form-model.test.ts src/features/events/data/signup-restrictions.test.ts src/features/events/data/my-activities-model.test.ts src/features/events/components/legacy/EventDetailMainView.test.tsx src/data/inbox-delivery.test.ts src/features/checkin/data/__tests__/attendance.test.ts src/features/events/data/attendance-edit.test.ts src/data/op-log.test.ts src/features/events/data/line-notify-bind.test.ts src/features/admin-banners/data/banner-model.test.ts src/features/admin-banners/data/banner-admin.test.ts src/core/event-time.test.ts src/features/checkin/CheckinPage.shell.test.tsx src/features/checkin/data/__tests__/scan-events.test.ts src/features/clubs/components/legacy/TeamDetailWeekStrip.test.tsx src/features/clubs/data/team-detail-model.test.ts src/features/clubs/pages/TeamDetailPage.test.tsx src/features/events/components/legacy/ActivityCalendar.test.tsx src/features/events/data/attendance-settle.test.ts src/features/events/data/calendar-model.test.ts src/features/events/data/event-calendar.test.ts src/features/events/data/event-comments.test.ts src/features/events/data/event-lifecycle.test.ts src/features/events/data/signup.test.ts src/features/events/data/terminal.test.ts src/features/events/pages/ActivitiesPage.test.tsx src/features/events/pages/EventDetailPage.3b2b.test.tsx src/features/home/data/next-activity.test.ts src/features/profile/data/activity-records.test.ts src/core/taipei-guard.test.ts
