    <!-- T-093：開頁同步處理 liff.state（少一次整頁載入）。測試：src/app/liff-state-inline.test.ts。 -->
    <script id="fcb-liff-state">
      (function () {
        try {
          var L = location;
          var path = String(L.pathname || '');
          var search = String(L.search || '');
          var hash = String(L.hash || '');
          var host = String(L.hostname || '');
          var params = new URLSearchParams(search);
          // 診斷只記長得像參數名稱的鍵；其餘（可能是裸 token）記成 *。
          var NAME = /^[A-Za-z0-9_.-]{1,40}$/;
          var nameOf = function (key) { return NAME.test(key) ? key : '*'; };
          var q = [];
          params.forEach(function (_value, key) {
            var qname = nameOf(key);
            if (key && q.indexOf(qname) === -1) q.push(qname);
          });
          var h = [];
          var hashBody = hash.charAt(0) === '#' ? hash.slice(1) : hash;
          if (hashBody) {
            var segs = hashBody.split('&');
            for (var i = 0; i < segs.length; i++) {
              var seg = segs[i];
              var cut = seg.indexOf('=');
              // 沒有「=」的片段可能是裸 token，不當成參數名稱。
              if (cut <= 0) continue;
              var hname = nameOf(seg.slice(0, cut));
              if (h.indexOf(hname) === -1) h.push(hname);
            }
          }
          var PUBLIC_ID = /^[A-Za-z0-9_-]{1,120}$/;
          var target = '';
          if (path === '/' && params.getAll('liff.state').length === 1 && params.getAll('event').length === 0 && params.getAll('team').length === 0 && params.getAll('profile').length === 0) {
            var state = params.get('liff.state');
            if (typeof state === 'string' && state.charAt(0) === '?') {
              var eq = state.indexOf('=');
              var kind = eq > 1 ? state.slice(1, eq) : '';
              var id = eq > 1 ? state.slice(eq + 1) : '';
              var dest = kind === 'event' ? '/events/' : kind === 'team' ? '/teams/' : kind === 'profile' ? '/profile/' : '';
              if (dest && PUBLIC_ID.test(id) && !(kind === 'profile' && id === 'qr')) {
                var raw = search.charAt(0) === '?' ? search.slice(1) : search;
                var parts = raw ? raw.split('&') : [];
                var kept = [];
                var dropped = false;
                for (var j = 0; j < parts.length; j++) {
                  var part = parts[j];
                  var peq = part.indexOf('=');
                  var pkey = peq === -1 ? part : part.slice(0, peq);
                  if (!dropped && pkey === 'liff.state') {
                    dropped = true;
                    continue;
                  }
                  kept.push(part);
                }
                if (dropped) target = dest + id + (kept.length ? '?' + kept.join('&') : '') + hash;
              }
            }
          }
          var ua = typeof navigator !== 'undefined' ? String(navigator.userAgent || '') : '';
          var auto = target !== '' && /\bLine\//i.test(ua) && /\bLIFF\b/.test(ua);
          try {
            if (host === 'next.toosterx.com') {
              var KEY = 'fcb:diag-loads';
              var prev = [];
              try {
                var parsed = JSON.parse(sessionStorage.getItem(KEY) || '[]');
                if (parsed && Object.prototype.toString.call(parsed) === '[object Array]') prev = parsed;
              } catch (e1) {
                prev = [];
              }
              var last = prev.length ? prev[prev.length - 1] : null;
              var n = last && typeof last.n === 'number' && last.n === last.n ? last.n + 1 : prev.length + 1;
              var shownPath = path.replace(/^\/(events|teams|profile)\/[^/?#]+/, '/$1/:id');
              prev.push({ n: n, path: shownPath, q: q, h: h, rewrote: target !== '', auto: auto });
              if (prev.length > 10) prev = prev.slice(prev.length - 10);
              sessionStorage.setItem(KEY, JSON.stringify(prev));
            }
          } catch (e2) {}
          if (target) {
            history.replaceState(history.state, '', target);
            // 站長 11-08 定案：Mini App 分享開頁要自動登入。只在 LINE Mini App（UA 同 login-redirect.ts#isLikelyMiniAppUserAgent）
            // 設旗標讓 App.tsx 照回跳流程接手；外部瀏覽器一律不設（SDK 不導向時非互動登入會失敗、反而擋掉整頁自動登入）。
            if (auto) window.__fcbLiffStateConsumed = true;
          }
        } catch (e) {}
      })();
    </script>

         __FCB_*__ 代號由該外掛在建置時換成真值（橫幅期限與格式版本 v 與 home-snapshot 同一個常數），這段註解也由它刪掉（不隨 HTML 送出）。測試：src/app/early-banners.test.ts。
         日後若加 CSP，必須放行 connect-src https://firestore.googleapis.com 與 img-src https://firebasestorage.googleapis.com。 -->
    <script id="fcb-early-banners">
      (function () {
        var P = '__FCB_PROJECT_ID__', L = location, M = 262144, K = /^home-(info|layout)$/, A = __FCB_BANNER_MAX_AGE_MS__, V = __FCB_SNAPSHOT_V__, S = __FCB_SNAPSHOT_SKEW_MS__;
        function str(f, k) {
          var v = (f || 0)[k];
          return v && typeof v.stringValue === 'string' ? v.stringValue : '';
        }
        function local(h) {
          return /^(localhost|127\.0\.0\.1|::1|\[::1\]|0\.0\.0\.0)$|\.(localhost|local)$|^(10\.\d{1,3}|192\.168|172\.(1[6-9]|2\d|3[01]))\.\d{1,3}\.\d{1,3}$/.test(String(h || '').trim().toLowerCase());
        }
        function warm() {
          try {
            var s = localStorage.getItem('fcb:home-banners:v1'), t = Date.now();
            s = s && s.length <= 100000 && JSON.parse(s);
            return s && s.v === V && Array.isArray(s.items) && s.items.length > 0 &&
              s.savedAt === +s.savedAt && t - s.savedAt <= A && s.savedAt <= t + S;
          } catch (_) {}
        }
        function body(r) {
          var g, d, x = '', k = 0;
          if (!r.ok || +r.headers.get('content-length') > M) return null;
          g = r.body && r.body.getReader && r.body.getReader();
          if (!g) return r.text().then(function (t) { return new TextEncoder().encode(t).length > M ? null : t; });
          d = new TextDecoder();
          return (function next() {
            return g.read().then(function (q) {
              if (q.done) return x + d.decode();
              if (q.value) {
                if ((k += q.value.byteLength) > M) { g.cancel().catch(function () {}); return null; }
                x += d.decode(q.value, { stream: true });
              }
              return next();
            });
          })();
        }
        function preload(p) {
          var i, d, q, f, m, u, k;
          if (p.some(function (e) { return e && e.error !== undefined; })) return;
          for (i = 0; i < p.length; i++) {
            d = (p[i] || 0).document || 0;
            q = typeof d.name === 'string' ? d.name.split('/') : [];
            f = d.fields;
            if (q.length !== 7 || q[2] !== 'databases' || q[4] !== 'documents' || q[5] !== 'banners' || !q[6] ||
              str(f, 'status').trim() !== 'active' || /^(shotgame|watchParty|homeInfo|homeLayout)$/.test(str(f, 'type')) ||
              K.test(str(f, 'slot')) || K.test(q[6]) || K.test(str(f, 'id').trim())) continue;
            m = str(f, 'image').trim();
            if (!m || m.length > 2000 || !/^https:\/\//i.test(m)) return;
            u = new URL(m);
            if (u.username || u.password || (u.host !== 'firebasestorage.googleapis.com' && u.origin !== L.origin)) return;
            k = document.createElement('link');
            k.setAttribute('rel', 'preload');
            k.setAttribute('as', 'image');
            k.setAttribute('fetchpriority', 'high');
            k.setAttribute('href', m);
            document.head.appendChild(k);
            return;
          }
        }
        try {
          if (L.pathname !== '/' || L.search || local(L.hostname) || warm()) return;
          var c = new AbortController(), t = setTimeout(function () { c.abort(); }, 4000);
          window.__fcbEarlyBanners = fetch('https://firestore.googleapis.com/v1/projects/' + P + '/databases/(default)/documents:runQuery', {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain' },
            body: '{"structuredQuery":{"from":[{"collectionId":"banners"}],"limit":200}}',
            credentials: 'omit',
            signal: c.signal
          }).then(body).then(function (x) {
            var p = x && JSON.parse(x);
            if (!Array.isArray(p)) return null;
            try { preload(p); } catch (_) {}
            return p;
          }).catch(function () { return null; }).then(function (v) { clearTimeout(t); c.abort(); return v; });
        } catch (_) {}
      })();
    </script>

    <!-- 照 A index.html：圖示、加到主畫面（PWA）相關標籤；manifest 由 vite.config.ts 的 PWA 設定產生（內容照 A manifest.json） -->
    <link rel="icon" href="/assets/icons/icon-192x192.png" type="image/png" />

    <script>
      /* 照 A index.html 開頁腳本：在畫面出現前設定 data-theme 與字級，避免顏色與字級閃爍（邏輯同 src/core/theme.ts、src/core/font-size.ts）。 */
      (function () {
        var theme = '';
        try {
          var saved = localStorage.getItem('sporthub_theme');
          if (saved === 'dark' || saved === 'light') theme = saved;
        } catch (_) {}
        if (!theme) {
          try {
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark';
          } catch (_) {}
        }
        document.documentElement.setAttribute('data-theme', theme || 'light');
        try {
          var s = localStorage.getItem('sporthub_font_size');
          if (s) document.documentElement.style.fontSize = s + 'px';
        } catch (_) {}
      })();
    </script>
    <script>
      /* 照 A index.html「全局圖片預解碼淡入」：A 的 base.css 讓圖片預設透明（改版頁面在 .legacy-ui 內生效），
         load 後 decode() 完成才加 img-loaded 顯示；載入失敗也加，避免永遠透明。 */
      document.addEventListener('load', function (e) {
        if (!e.target || e.target.tagName !== 'IMG') return;
        var img = e.target;
        if (typeof img.decode === 'function') {
          img.decode().then(function () { img.classList.add('img-loaded'); })
            .catch(function () { img.classList.add('img-loaded'); });
        } else {
          img.classList.add('img-loaded');
        }
      }, true);
      document.addEventListener('error', function (e) {
        if (e.target && e.target.tagName === 'IMG') e.target.classList.add('img-loaded');
      }, true);
    </script>
