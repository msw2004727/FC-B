<!doctype html>
<html lang="zh-TW" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <title>ToosterX</title>
    <script>
      /* 照 A index.html 開頁腳本：在畫面出現前設定 data-theme，避免顏色閃爍（邏輯同 src/core/theme.ts）。 */
      (function () {
        var theme = '';
        try {
          var saved = localStorage.getItem('sporthub_theme');
          if (saved === 'dark' || saved === 'light') theme = saved;
        } catch (_) {}
        if (!theme) {
          try {
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark';
          } catch (_) {}
        }
        document.documentElement.setAttribute('data-theme', theme || 'light');
      })();
    </script>
    <script>
      /* 照 A index.html「全局圖片預解碼淡入」：A 的 base.css 讓圖片預設透明（改版頁面在 .legacy-ui 內生效），
         load 後 decode() 完成才加 img-loaded 顯示；載入失敗也加，避免永遠透明。 */
      document.addEventListener('load', function (e) {
        if (!e.target || e.target.tagName !== 'IMG') return;
        var img = e.target;
        if (typeof img.decode === 'function') {
          img.decode().then(function () { img.classList.add('img-loaded'); })
            .catch(function () { img.classList.add('img-loaded'); });
        } else {
          img.classList.add('img-loaded');
        }
      }, true);
      document.addEventListener('error', function (e) {
        if (e.target && e.target.tagName === 'IMG') e.target.classList.add('img-loaded');
      }, true);
    </script>
  </head>
  <body>
    <!--
      開頁骨架：頂部列與底部導覽的靜態外觀（結構與 class 同 src/ui/TopBar.tsx、BottomNav.tsx），
      CSS 一到就有畫面，不必等 JS 下載與執行；main.tsx 第一次 render 前清空。
      改了 TopBar／BottomNav 結構時同步這裡（src/app/boot-shell.test.ts 會比對 id／class）。
    -->
    <div id="app"><div class="app-shell ui-app-shell" data-boot-shell style="pointer-events:none">
      <div class="legacy-ui legacy-chrome"><header id="top-bar">
        <button id="menu-toggle" type="button" aria-label="選單" tabindex="-1"><span></span><span></span><span></span></button>
        <div class="logo"><a href="/" aria-label="首頁" style="display:flex;align-items:center;justify-content:center"><img id="top-logo-img" class="logo-img img-loaded" alt="ToosterX" width="473" height="96" fetchpriority="high"></a></div>
        <script>
          /* 依開頁主題選 logo，HTML 解析到這裡就開始下載（與 TopBar 同一個檔案，之後直接用快取）。 */
          (function () {
            var dark = document.documentElement.getAttribute('data-theme') === 'dark';
            var img = document.getElementById('top-logo-img');
            if (img) img.src = dark ? '/assets/logo-white.webp' : '/assets/logo-black.webp';
          })();
        </script>
        <div class="top-bar-right">
          <div class="sport-picker-wrapper" id="sport-picker-wrapper"><button type="button" class="sport-picker-btn" id="sport-picker-btn" tabindex="-1"><span class="sport-picker-icon"><span class="sp-all-label" aria-hidden="true">All</span></span></button></div>
          <a id="notif-btn" href="/inbox" tabindex="-1" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 01-3.46 0"></path></svg></a>
          <div id="line-login-wrapper" class="line-login-wrapper"></div>
          <script>
            /* 上次已登入（src/data/auth-hint.ts 的 fcb:signed-in）畫頭像位置，否則畫 LINE 登入按鈕；與 TopBar 首次畫面一致。 */
            (function () {
              var signedIn = false;
              try { signedIn = localStorage.getItem('fcb:signed-in') === '1'; } catch (_) {}
              var wrap = document.getElementById('line-login-wrapper');
              if (!wrap) return;
              wrap.innerHTML = signedIn
                ? '<div id="line-user-topbar" class="line-user-topbar"><div id="line-avatar-topbar" class="line-avatar-topbar line-avatar-fallback"></div></div>'
                : '<button id="line-login-btn" type="button" class="line-login-btn" tabindex="-1"><svg width="16" height="16" viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M12 2C6.48 2 2 5.83 2 10.5c0 4.18 3.66 7.68 8.58 8.38.33.07.78.22.9.5.1.26.07.66.03.92l-.15.86c-.04.26-.2 1.01.88.55s5.88-3.47 8.03-5.93C22.08 13.79 22 12.18 22 10.5 22 5.83 17.52 2 12 2z"></path></svg>LINE 登入</button>';
            })();
          </script>
        </div>
      </header></div>
      <main class="app-main"></main>
      <div class="legacy-ui legacy-chrome"><nav id="bottom-tabs" aria-hidden="true">
        <button type="button" class="bot-tab" tabindex="-1"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9H4.5a2.5 2.5 0 010-5C7 4 7 7 7 7"></path><path d="M18 9h1.5a2.5 2.5 0 000-5C17 4 17 7 17 7"></path><path d="M4 22h16"></path><path d="M10 14.66V22"></path><path d="M14 14.66V22"></path><path d="M8 6v4a4 4 0 008 0V6H8z"></path></svg><span>賽事</span></button>
        <button type="button" class="bot-tab" tabindex="-1"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 00-3-3.87"></path><path d="M16 3.13a4 4 0 010 7.75"></path></svg><span>俱樂部</span></button>
        <div class="bot-tab-center-wrap"><button type="button" class="bot-tab-qr" tabindex="-1"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="8" height="8" rx="1"></rect><rect x="14" y="2" width="8" height="8" rx="1"></rect><rect x="2" y="14" width="8" height="8" rx="1"></rect><rect x="14" y="14" width="4" height="4"></rect><line x1="22" y1="14" x2="22" y2="18"></line><line x1="18" y1="22" x2="22" y2="22"></line></svg></button><button type="button" class="bot-tab" tabindex="-1"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"></path></svg><span>首頁</span></button></div>
        <button type="button" class="bot-tab" tabindex="-1"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg><span>活動</span></button>
        <button type="button" class="bot-tab" tabindex="-1"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg><span>我的</span></button>
      </nav></div>
    </div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
