<!doctype html>
<html lang="zh-TW" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <!-- T-042：首頁一開就會連的來源，趁下載 JS 時先做好 DNS＋TCP＋TLS（手機上每個新來源約 0.3～0.6 秒）。
         firestore 的讀取是 CORS 請求，要帶 crossorigin 才會重用這條連線；橫幅圖是 <img>（不帶 crossorigin）。
         其餘（登入還原、舊的登入彈窗頁）只預先解析 DNS，避免白占連線。 -->
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://firebasestorage.googleapis.com" />
    <link rel="dns-prefetch" href="https://identitytoolkit.googleapis.com" />
    <link rel="dns-prefetch" href="https://securetoken.googleapis.com" />
    <link rel="dns-prefetch" href="https://www.googleapis.com" />
    <link rel="dns-prefetch" href="https://fc-football-6c8dc.firebaseapp.com" />
    <!-- T-042d：冷啟動提早發橫幅 REST、預載第一張橫幅圖（HTML 一到就開始，不等入口 JS）。只做這兩件事：
         ① 匿名 runQuery，把「原始回應」掛在 window.__fcbEarlyBanners（Promise；失敗一律 null、不 reject、不寫 console）；
         ② 第一張候選橫幅的圖網址通過 https＋白名單主機（firebasestorage.googleapis.com 或同源）才插一個 preload link。
         不解析成畫面資料、不寫快照：映射、toPublicBanners 白名單與快照寫入守門都在 HomePage（startBannersRestFetch 接手）。
         __FCB_*__ 兩個代號由 scripts/early-banners-html.ts 建置時換成真值（emulator 建置整段移除）；發不發的條件同
         canUseBannersRest()＋readBannersSnapshot()，另只在首頁網址（路徑 / 且無查詢字串），src/app/early-banners.test.ts 鎖定。
         日後若加 CSP，必須放行 connect-src https://firestore.googleapis.com 與 img-src https://firebasestorage.googleapis.com。 -->
    <script id="fcb-early-banners">
      (function () {
        var P = '__FCB_PROJECT_ID__', V = '__FCB_APP_VERSION__', L = location, M = 262144, K = /^home-(info|layout)$/;
        function str(f, k) {
          var v = (f || 0)[k];
          return v && typeof v.stringValue === 'string' ? v.stringValue : '';
        }
        function local(h) {
          return /^(localhost|127\.0\.0\.1|::1|\[::1\]|0\.0\.0\.0)$|\.(localhost|local)$|^(10\.\d{1,3}|192\.168|172\.(1[6-9]|2\d|3[01]))\.\d{1,3}\.\d{1,3}$/.test(String(h || '').trim().toLowerCase());
        }
        function warm() {
          try {
            var s = localStorage.getItem('fcb:home-banners:v1'), t = Date.now();
            s = s && s.length <= 100000 && JSON.parse(s);
            return s && s.v === 1 && s.appVersion === V && Array.isArray(s.items) && s.items.length > 0 &&
              s.savedAt === +s.savedAt && t - s.savedAt <= 1800000 && s.savedAt <= t + 60000;
          } catch (_) {}
        }
        function body(r) {
          var g, d, x = '', k = 0;
          if (!r.ok || +r.headers.get('content-length') > M) return null;
          g = r.body && r.body.getReader && r.body.getReader();
          if (!g) return r.text().then(function (t) { return new TextEncoder().encode(t).length > M ? null : t; });
          d = new TextDecoder();
          return (function next() {
            return g.read().then(function (q) {
              if (q.done) return x + d.decode();
              if (q.value) {
                if ((k += q.value.byteLength) > M) { g.cancel().catch(function () {}); return null; }
                x += d.decode(q.value, { stream: true });
              }
              return next();
            });
          })();
        }
        function preload(p) {
          var i, d, q, f, m, u, k;
          if (p.some(function (e) { return e && e.error !== undefined; })) return;
          for (i = 0; i < p.length; i++) {
            d = (p[i] || 0).document || 0;
            q = typeof d.name === 'string' ? d.name.split('/') : [];
            f = d.fields;
            if (q.length !== 7 || q[2] !== 'databases' || q[4] !== 'documents' || q[5] !== 'banners' || !q[6] ||
              str(f, 'status').trim() !== 'active' || /^(shotgame|watchParty|homeInfo|homeLayout)$/.test(str(f, 'type')) ||
              K.test(str(f, 'slot')) || K.test(q[6]) || K.test(str(f, 'id').trim())) continue;
            m = str(f, 'image').trim();
            if (!m || m.length > 2000 || !/^https:\/\//i.test(m)) return;
            u = new URL(m);
            if (u.username || u.password || (u.host !== 'firebasestorage.googleapis.com' && u.origin !== L.origin)) return;
            k = document.createElement('link');
            k.setAttribute('rel', 'preload');
            k.setAttribute('as', 'image');
            k.setAttribute('fetchpriority', 'high');
            k.setAttribute('href', m);
            document.head.appendChild(k);
            return;
          }
        }
        try {
          if (L.pathname !== '/' || L.search || local(L.hostname) || warm()) return;
          var c = new AbortController(), t = setTimeout(function () { c.abort(); }, 4000);
          window.__fcbEarlyBanners = fetch('https://firestore.googleapis.com/v1/projects/' + P + '/databases/(default)/documents:runQuery', {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain' },
            body: '{"structuredQuery":{"from":[{"collectionId":"banners"}],"limit":200}}',
            credentials: 'omit',
            signal: c.signal
          }).then(body).then(function (x) {
            var p = x && JSON.parse(x);
            if (!Array.isArray(p)) return null;
            try { preload(p); } catch (_) {}
            return p;
          }).catch(function () { return null; }).then(function (v) { clearTimeout(t); return v; });
        } catch (_) {}
      })();
    </script>
    <title>ToosterX</title>
    <!-- 照 A index.html：圖示、加到主畫面（PWA）相關標籤；manifest 由 vite.config.ts 的 PWA 設定產生（內容照 A manifest.json） -->
    <link rel="icon" href="/assets/icons/icon-192x192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#0d9488" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ToosterX" />
    <script>
      /* 照 A index.html 開頁腳本：在畫面出現前設定 data-theme 與字級，避免顏色與字級閃爍（邏輯同 src/core/theme.ts、src/core/font-size.ts）。 */
      (function () {
        var theme = '';
        try {
          var saved = localStorage.getItem('sporthub_theme');
          if (saved === 'dark' || saved === 'light') theme = saved;
        } catch (_) {}
        if (!theme) {
          try {
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark';
          } catch (_) {}
        }
        document.documentElement.setAttribute('data-theme', theme || 'light');
        try {
          var s = localStorage.getItem('sporthub_font_size');
          if (s) document.documentElement.style.fontSize = s + 'px';
        } catch (_) {}
      })();
    </script>
    <script>
      /* 照 A index.html「全局圖片預解碼淡入」：A 的 base.css 讓圖片預設透明（改版頁面在 .legacy-ui 內生效），
         load 後 decode() 完成才加 img-loaded 顯示；載入失敗也加，避免永遠透明。 */
      document.addEventListener('load', function (e) {
        if (!e.target || e.target.tagName !== 'IMG') return;
        var img = e.target;
        if (typeof img.decode === 'function') {
          img.decode().then(function () { img.classList.add('img-loaded'); })
            .catch(function () { img.classList.add('img-loaded'); });
        } else {
          img.classList.add('img-loaded');
        }
      }, true);
      document.addEventListener('error', function (e) {
        if (e.target && e.target.tagName === 'IMG') e.target.classList.add('img-loaded');
      }, true);
    </script>
  </head>
  <body>
    <!--
      開頁骨架：頂部列與底部導覽的靜態外觀（結構與 class 同 src/ui/TopBar.tsx、BottomNav.tsx），
      CSS 一到就有畫面，不必等 JS 下載與執行；main.tsx 第一次 render 前清空。
      改了 TopBar／BottomNav 結構時同步這裡（src/app/boot-shell.test.ts 會比對 id／class）。
    -->
    <div id="app"><div class="app-shell ui-app-shell" data-boot-shell style="pointer-events:none">
      <div class="legacy-ui legacy-chrome"><header id="top-bar">
        <button id="menu-toggle" type="button" aria-label="選單" tabindex="-1"><span></span><span></span><span></span></button>
        <div class="logo"><a href="/" aria-label="首頁" style="display:flex;align-items:center;justify-content:center"><img id="top-logo-img" class="logo-img img-loaded" alt="ToosterX" width="473" height="96" fetchpriority="high"></a></div>
        <script>
          /* 依開頁主題選 logo，HTML 解析到這裡就開始下載（與 TopBar 同一個檔案，之後直接用快取）。 */
          (function () {
            var dark = document.documentElement.getAttribute('data-theme') === 'dark';
            var img = document.getElementById('top-logo-img');
            if (img) img.src = dark ? '/assets/logo-white.webp' : '/assets/logo-black.webp';
          })();
        </script>
        <div class="top-bar-right">
          <div class="sport-picker-wrapper" id="sport-picker-wrapper"><button type="button" class="sport-picker-btn" id="sport-picker-btn" tabindex="-1"><span class="sport-picker-icon"><span class="sp-all-label" aria-hidden="true">All</span></span></button></div>
          <a id="notif-btn" href="/inbox" tabindex="-1" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 01-3.46 0"></path></svg></a>
          <div id="line-login-wrapper" class="line-login-wrapper"></div>
          <script>
            /* 上次已登入（src/data/auth-hint.ts 的 fcb:signed-in）畫頭像位置，否則畫 LINE 登入按鈕；與 TopBar 首次畫面一致。 */
            (function () {
              var signedIn = false;
              try { signedIn = localStorage.getItem('fcb:signed-in') === '1'; } catch (_) {}
              var wrap = document.getElementById('line-login-wrapper');
              if (!wrap) return;
              wrap.innerHTML = signedIn
                ? '<div id="line-user-topbar" class="line-user-topbar" aria-hidden="true"><div id="line-avatar-topbar" class="line-avatar-topbar line-avatar-fallback line-avatar-loading"><span class="line-avatar-spinner" aria-hidden="true"></span></div></div>'
                : '<button id="line-login-btn" type="button" class="line-login-btn" tabindex="-1"><svg width="16" height="16" viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M12 2C6.48 2 2 5.83 2 10.5c0 4.18 3.66 7.68 8.58 8.38.33.07.78.22.9.5.1.26.07.66.03.92l-.15.86c-.04.26-.2 1.01.88.55s5.88-3.47 8.03-5.93C22.08 13.79 22 12.18 22 10.5 22 5.83 17.52 2 12 2z"></path></svg>LINE 登入</button>';
            })();
          </script>
        </div>
      </header></div>
      <main class="app-main"></main>
      <div class="legacy-ui legacy-chrome"><nav id="bottom-tabs" aria-hidden="true">
        <button type="button" class="bot-tab" tabindex="-1"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9H4.5a2.5 2.5 0 010-5C7 4 7 7 7 7"></path><path d="M18 9h1.5a2.5 2.5 0 000-5C17 4 17 7 17 7"></path><path d="M4 22h16"></path><path d="M10 14.66V22"></path><path d="M14 14.66V22"></path><path d="M8 6v4a4 4 0 008 0V6H8z"></path></svg><span>賽事</span></button>
        <button type="button" class="bot-tab" tabindex="-1"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 00-3-3.87"></path><path d="M16 3.13a4 4 0 010 7.75"></path></svg><span>俱樂部</span></button>
        <div class="bot-tab-center-wrap"><button type="button" class="bot-tab-qr" tabindex="-1"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="8" height="8" rx="1"></rect><rect x="14" y="2" width="8" height="8" rx="1"></rect><rect x="2" y="14" width="8" height="8" rx="1"></rect><rect x="14" y="14" width="4" height="4"></rect><line x1="22" y1="14" x2="22" y2="18"></line><line x1="18" y1="22" x2="22" y2="22"></line></svg></button><button type="button" class="bot-tab" tabindex="-1"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"></path></svg><span>首頁</span></button></div>
        <button type="button" class="bot-tab" tabindex="-1"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg><span>活動</span></button>
        <button type="button" class="bot-tab" tabindex="-1"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg><span>我的</span></button>
      </nav></div>
    </div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
